[package]
name = "yafm"
version = "0.1.3"
authors = ["Radu Petean <radu@petean.ro>"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.88"
readme = "README.md"
keywords = ["file-manager", "terminal", "tui", "lfm"]
categories = ["command-line-utilities", "filesystem"]
description = "yafm - Yet Another File Manager (Rust port of Last File Manager 3.1)"

[lib]
name = "yafm"
path = "src/lib.rs"

[[bin]]
name = "yafm"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
glob = "0.3"
log = "0.4"
nix = { version = "0.29", features = ["fs", "user", "signal", "process"] }
ratatui = "0.29"
regex = "1"
rhai = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
similar = "2"
simplelog = "0.12"
strum = { version = "0.26", features = ["derive"] }
tempfile = "3"
toml = { version = "0.8", features = ["preserve_order"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
